name: Sync and Apply Labels

"on":
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
      - .github/labeler.yml
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync repository labels
    if: github.event_name != 'pull_request_target'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync repository labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: true

  apply:
    name: Apply labels from changed files
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Apply type labels (bug or enhancement)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = (pr.title || "").toLowerCase();
            const body = pr.body || "";
            const labelsToAdd = new Set();

            if (/^(feat|enhancement)(\(.*\))?:/.test(title)) {
              labelsToAdd.add("enhancement");
            } else if (/^(fix|bugfix|hotfix)(\(.*\))?:/.test(title)) {
              labelsToAdd.add("bug");
            }

            if (/-\s*\[[xX]\]\s*(?:new feature|enhancement|new sensor)/i.test(body)) {
              labelsToAdd.add("enhancement");
            }
            if (/-\s*\[[xX]\]\s*bug fix/i.test(body)) {
              labelsToAdd.add("bug");
            }

            if (labelsToAdd.size === 0) {
              const issueMatches = body.match(/#(?:[0-9]+)/g) || [];
              for (const issueRef of issueMatches) {
                const issueNum = parseInt(issueRef.replace("#", ""), 10);
                if (!issueNum) continue;
                try {
                  const issue = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNum,
                  });
                  const issueLabels = (issue.data.labels || []).map((l) => (typeof l === "string" ? l : l.name));
                  if (issueLabels.includes("enhancement")) labelsToAdd.add("enhancement");
                  if (issueLabels.includes("bug")) labelsToAdd.add("bug");
                } catch {
                  // Ignore if issue cannot be fetched
                }
              }
            }

            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labelsToAdd),
              });
              core.info(`Applied type labels: ${Array.from(labelsToAdd).join(", ")}`);
            }
