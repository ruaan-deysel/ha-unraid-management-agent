name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CODECOV_OIDC: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')) }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.22
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14.2

      - name: Install dependencies
        run: |
          uv venv --python 3.14.2
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev,test]"

      - name: Run tests and generate coverage report
        run: |
          pytest --cov=custom_components/unraid_management_agent --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          slug: ${{ github.repository }}
          files: ./coverage.xml
          flags: unittests
          name: ha-unraid-management-agent
          use_oidc: ${{ env.CODECOV_OIDC == 'true' }}
          fail_ci_if_error: ${{ env.CODECOV_OIDC == 'true' }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests & coverage
        run: npm run test:coverage

      - name: Build bundle
        run: npm run build

      - name: Committed bundle matches source
        run: |
          changes="$(git status --porcelain --untracked-files=all -- ../custom_components/unraid_management_agent/frontend/)"
          if [ -n "$changes" ]; then
            echo "Committed frontend bundle is out of date:"
            echo "$changes"
            git diff -- ../custom_components/unraid_management_agent/frontend/
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:browser

      - name: Upload browser test traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
