# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2
updates:
  # Update pip dependencies in requirements.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      pip-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    allow:
      - dependency-type: all
    reviewers:
      - ruaan-deysel
    pull-request-branch-name:
      separator: /

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    reviewers:
      - ruaan-deysel
